name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately. Bumped from 1.3.14:
          # that version's `bun audit --prod` misreported examples/basic's
          # shadcn (a devDependency) as production-reachable even though the
          # manifest correctly scopes it -- confirmed fixed on 1.4.0.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build:packages

      - name: Test
        run: bun test

  test-postgres:
    name: Test (Postgres migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible builds — bump deliberately.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runPostgresMigrations tests are gated on DATABASE_URL and skipped
      # otherwise (see migrate.test.ts), so only this job exercises the real
      # Postgres rollback/retry behavior via the service container above.
      - name: Test (Postgres migrations)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun test packages/core/src/data/migrate.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Was 1.3.14 until this job's own audit job exposed a bug in it:
          # `bun audit --prod` misreported examples/basic's shadcn (a real
          # devDependency) as production-reachable, even though the manifest
          # correctly scopes it there -- confirmed fixed on 1.4.0. Every other
          # job in this file pins the same version for consistency; bump all
          # of them together.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Two advisories deliberately ignored here, both with no fix to
      # upgrade to -- revisit each if/when that changes, or drop the
      # dependency pulling it in if it stays unmaintained:
      #  - GHSA-gcqx-w48m-w2h4 (deepmerge mergeObject() prototype pollution,
      #    low severity): deepmerge 4.3.1 is the latest version ever
      #    published to npm, via shadcn's own devDependency tree (dev-only
      #    codegen tooling, not shipped). No longer showing up in scans as of
      #    this comment -- kept in case the advisory data is reinstated;
      #    `bun audit --ignore` silently no-ops on an advisory that isn't
      #    present, so this is harmless either way.
      #  - GHSA-fc5q-39xc-vjpf (picomatch ReDoS via repeated extglobs, high
      #    severity): 4.0.7 is the latest release and is still affected; no
      #    fixed version exists yet. Reached only via dev-time tooling
      #    (changesets' own release tooling, shadcn's codegen tree, tsup's
      #    bundler tree, @tailwindcss/cli's file watcher) -- none of it
      #    processes attacker-controlled glob patterns at runtime, so the
      #    abstract "high" severity doesn't reflect this repo's actual
      #    exposure. `bun audit --prod` (below, no ignores) confirms none of
      #    these chains reach anything actually shipped.
      - name: Audit dependencies
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-fc5q-39xc-vjpf

      # Guard the production-only graph separately: anything in what's actually
      # shipped must be clean with NO ignores.
      - name: Audit production dependencies
        run: bun audit --prod

      # Workspace version gate: bun's --frozen-lockfile does NOT fail when
      # workspace package versions (e.g. "@thexjs/core": 1.8.2 vs 1.8.3) drift
      # from package.json after `changeset version`. See issue #247.
      - name: Verify bun.lock workspace versions
        run: bun run check:bun-lock

      # bun.lock integrity gate: depends on bun's own `--frozen-lockfile`
      # (which enforces lockfile <-> package.json sync on install, above), plus
      # a committed hash so an *unreviewed* hand-edit of the lockfile fails CI
      # even when it happens to stay in sync. Regenerate with `git add bun.lock`
      # then `bun run update:bun-hash` or `shasum -a 256 bun.lock` and update `.github/bun-lock.sha256`.
      - name: Verify bun.lock integrity hash
        run: |
          actual="$(shasum -a 256 bun.lock | awk '{print $1}')"
          expected="$(cat .github/bun-lock.sha256)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::bun.lock changed but .github/bun-lock.sha256 was not updated. Expected $expected, got $actual. Starting Bun workspaces on a new version is fine — update the hash deliberately."
            exit 1
          fi
          echo "bun.lock hash verified: $actual"

  cve:
    name: CVE scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan dependency tree for known CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker:
    name: Docker build + image CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the production image
        run: docker build -t thexjs:ci .

      - name: Scan the built image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: thexjs:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Block on CVEs that have an available fix but aren't applied; CVEs
          # with no upstream fix yet (affected/fix_deferred) don't hold the
          # pipeline forever. The Dockerfile patches base-image packages.
          ignore-unfixed: "true"

  bench:
    name: Load test (SLO-gated)
    runs-on: ubuntu-latest
    # Gates the merge: a run that violates an SLO, produces server errors,
    # breaks the rate limiter, or fails the crash-recovery scenario (#129 —
    # kill -9 the server, restart it, assert traffic resumes within a bound)
    # fails the build. Thresholds live in scripts/bench/slo.ts and
    # BENCHMARKS.md; they are loose enough for shared runners while still
    # catching real (3-10x) regressions.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run load test (SLO gate)
        run: bun scripts/bench/load.ts --duration 3 --slo

      - name: Report load results
        if: always()
        run: |
          echo "::group::Latest benchmark"
          bun scripts/bench/load.ts --duration 1 2>&1 | tail -20
          echo "::endgroup::"
          echo "Load test artifacts: ${{ runner.os }}. See BENCHMARKS.md for methodology, SLOs and baseline numbers."
